<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video Maker · Cristal Líquido · todas las vistas</title>
<style>
:root{
  --glass-thin:rgba(255,255,255,.5);--glass-regular:rgba(255,255,255,.58);--glass-thick:rgba(255,255,255,.7);--glass-sub:rgba(255,255,255,.6);
  --glass-border:rgba(255,255,255,.75);--line:rgba(0,0,0,.1);
  --ink:#1d1d1f;--ink2:#48484a;--ink3:#6e6e73;
  --action:#0a6cff;--action-soft:rgba(10,108,255,.12);
  --canvas:#e8eaf0;--ambient:linear-gradient(150deg,#c7d4ee 0%,#e2d5ea 45%,#f2ded3 100%);
  --orb-a:rgba(100,150,255,.3);--orb-b:rgba(255,160,120,.24);
  --shadow-card:0 6px 24px rgba(31,38,74,.1);--shadow-panel:0 10px 32px rgba(31,38,74,.13);
  --stage:#0b0d14;--tile:#fff;--viewer:#0a0c14;
  --ok-soft:rgba(40,167,69,.16);--ok-ink:#0b6623;--warn-soft:rgba(232,137,12,.18);--warn-ink:#8a5200;--teal-soft:rgba(0,168,181,.16);--teal-ink:#00646e;--red-soft:rgba(229,55,46,.14);--red-ink:#c42b22;
}
:root[data-theme=dark]{
  --glass-thin:rgba(60,60,67,.5);--glass-regular:rgba(44,44,52,.55);--glass-thick:rgba(44,44,50,.6);--glass-sub:rgba(0,0,0,.3);
  --glass-border:rgba(255,255,255,.12);--line:rgba(255,255,255,.15);
  --ink:#f5f5f7;--ink2:rgba(235,235,245,.72);--ink3:rgba(235,235,245,.62);
  --action:#409cff;--action-soft:rgba(64,156,255,.18);
  --canvas:#101322;--ambient:linear-gradient(160deg,#101322 0%,#1d1730 60%,#231b26 100%);
  --orb-a:rgba(90,120,255,.25);--orb-b:rgba(255,150,120,.12);
  --shadow-card:0 6px 24px rgba(0,0,0,.3);--shadow-panel:0 10px 32px rgba(0,0,0,.35);
  --tile:#1a1d29;
  --ok-soft:rgba(48,209,88,.18);--ok-ink:#7ee59a;--warn-soft:rgba(255,159,10,.2);--warn-ink:#ffc266;--teal-soft:rgba(64,200,224,.18);--teal-ink:#7fe3f0;--red-soft:rgba(255,69,58,.18);--red-ink:#ff8a80;
}
*{box-sizing:border-box;margin:0}
body{font:13.5px/1.5 Inter,-apple-system,system-ui,sans-serif;color:var(--ink);background:var(--canvas)}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
.bar{display:flex;gap:12px;align-items:center;padding:10px 20px;background:var(--glass-thick);border-bottom:.5px solid var(--glass-border)}
.bar button{font:inherit;cursor:pointer;border:.5px solid var(--glass-border);background:var(--glass-thin);color:var(--ink);padding:6px 12px;border-radius:10px}
.bar button[aria-pressed=true]{background:var(--action);color:#fff;border-color:transparent}
.sp{flex:1}
.label{margin:22px 20px 0;font:600 10.5px/1 "JetBrains Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.scene{position:relative;overflow:hidden;margin:20px;border-radius:20px;border:.5px solid var(--glass-border);height:900px;isolation:isolate}
.scene>.bg{position:absolute;inset:0;background:var(--ambient),var(--canvas);z-index:-1}
.scene>.bg i{position:absolute;border-radius:50%;filter:blur(90px)}
.scene>.bg i:nth-child(1){width:300px;height:300px;top:-80px;left:35%;background:var(--orb-a)}
.scene>.bg i:nth-child(2){width:280px;height:280px;bottom:-90px;right:5%;background:var(--orb-b)}
.app{position:relative;display:grid;grid-template-columns:236px 1fr;height:100%}
.glass{background:var(--glass-regular);backdrop-filter:blur(26px) saturate(1.6);border:.5px solid var(--glass-border)}
.thick{background:var(--glass-thick);backdrop-filter:blur(34px) saturate(1.7);border:.5px solid var(--glass-border)}
.thin{background:var(--glass-thin);backdrop-filter:blur(16px);border:.5px solid var(--glass-border)}
.sub{background:var(--glass-sub);border:.5px solid var(--line)}
.side{margin:12px 0 12px 12px;border-radius:20px;padding:16px 12px;display:flex;flex-direction:column;gap:2px;box-shadow:var(--shadow-panel)}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 14px;font-weight:700;font-size:15px;letter-spacing:-.2px}
.brand span{width:28px;height:28px;border-radius:9px;background:linear-gradient(135deg,var(--action),#7a5cff);display:grid;place-items:center;color:#fff;font-size:13px}
.nav a{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;color:var(--ink2);font-weight:500}
.nav a.on{background:var(--action-soft);color:var(--action);font-weight:600}
.cap{font:600 10.5px/1 "JetBrains Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);padding:14px 10px 6px}
.vid{margin:2px 0 6px 10px;padding:6px;border-radius:14px;display:flex;flex-direction:column;gap:2px}
.vid .vt{font-weight:600;font-size:12px;padding:4px 8px 6px}
.vid a{padding:5px 8px;font-size:12.5px;gap:8px;display:flex;align-items:center;border-radius:9px;color:var(--ink2)}
.vid a.on{background:var(--action-soft);color:var(--action);font-weight:600}
.n{width:7px;height:7px;border-radius:50%;background:var(--ink3);opacity:.5;display:inline-block}.n.ok{background:#28a745;opacity:1}.n.w{background:#e8890c;opacity:1}
.foot{display:flex;align-items:center;justify-content:space-between;padding:8px;border-radius:12px}
.pill{display:inline-flex;gap:6px;align-items:center;border-radius:999px;padding:3px 10px;font-size:10.5px;font-weight:600;border:.5px solid var(--glass-border);white-space:nowrap}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor}
.ok{background:var(--ok-soft);color:var(--ok-ink)}.warn{background:var(--warn-soft);color:var(--warn-ink)}.teal{background:var(--teal-soft);color:var(--teal-ink)}.red{background:var(--red-soft);color:var(--red-ink)}
.main{padding:12px 16px 12px 14px;display:flex;flex-direction:column;gap:12px;min-width:0;min-height:0}
.tb{display:flex;align-items:center;gap:12px;border-radius:16px;padding:8px 10px 8px 16px;min-height:52px;box-shadow:var(--shadow-card)}
.tb h1{font-size:17px;letter-spacing:-.3px;line-height:1.2;font-weight:700}.tb small{color:var(--ink3)}
.btn{font:inherit;font-weight:600;border:0;border-radius:10px;padding:8px 16px;color:#fff;background:var(--action);box-shadow:0 2px 12px rgba(10,108,255,.35);white-space:nowrap}
.btn.sec{background:var(--glass-thin);color:var(--ink);border:.5px solid var(--glass-border);box-shadow:none}
.btn.red{background:var(--red-soft);color:var(--red-ink);box-shadow:none}
.btn.sm{padding:5px 11px;font-size:12px}
.panel{border-radius:20px;padding:16px;box-shadow:var(--shadow-panel);display:flex;flex-direction:column;gap:12px;min-height:0}
.panel h2{font-size:15px;font-weight:600}
.h2row{display:flex;align-items:center;gap:10px}
.note{font-size:11.5px;color:var(--ink3)}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:12px;align-self:flex-start}
.seg span{padding:5px 14px;border-radius:9px;font-weight:500;font-size:12.5px;color:var(--ink2)}
.seg span.on{background:var(--action);color:#fff;box-shadow:0 2px 12px rgba(10,108,255,.35)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border-radius:999px;padding:5px 11px;font-size:12px;font-weight:500}
.chip.on{background:var(--ink);color:var(--canvas)}
.field{display:flex;flex-direction:column;gap:5px}
.field>b{font-size:12px;font-weight:600;color:var(--ink2)}
.in{border-radius:10px;padding:9px 12px;color:var(--ink);min-height:38px}
.in.ph{color:var(--ink3)}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g6{grid-template-columns:repeat(6,1fr)}
.tile{background:var(--tile);border-radius:10px;border:.5px solid var(--line);display:grid;place-items:center;font-size:11px;color:var(--ink3);position:relative;aspect-ratio:4/3;overflow:hidden}
.tile em{position:absolute;left:6px;bottom:6px;font-style:normal;font:600 9.5px "JetBrains Mono",monospace;background:var(--stage);color:#fff;padding:2px 6px;border-radius:6px}
.tile.sel{outline:2px solid var(--action);outline-offset:-2px}
.tile .ck{position:absolute;right:6px;top:6px;width:18px;height:18px;border-radius:50%;background:var(--action);color:#fff;display:grid;place-items:center;font-size:11px}
.tile.add{border-style:dashed;background:transparent;color:var(--action)}
.stage{background:var(--stage);border-radius:14px;display:grid;place-items:center;position:relative;overflow:hidden;border:.5px solid var(--line);color:#8a90a6}
.stage .play{width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;color:#fff;font-size:20px}
.stage .ctl{position:absolute;left:0;right:0;bottom:0;padding:10px 14px;display:flex;gap:10px;color:#fff;font-size:11px;background:linear-gradient(transparent,rgba(0,0,0,.7))}
.stage .ctl i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.3);align-self:center}.stage .ctl i b{display:block;width:22%;height:100%;background:#fff;border-radius:2px}
.row{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:.5px solid var(--line)}
.row:last-child{border-bottom:0}
.sw{width:22px;height:22px;border-radius:7px;border:.5px solid var(--line)}
.savebar{display:flex;align-items:center;gap:10px;border-radius:16px;padding:8px 10px 8px 16px;box-shadow:var(--shadow-card)}
.card{border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}
.vlist{display:flex;flex-direction:column}
.radio{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--ink3);display:inline-block;flex:none}.radio.on{border:5px solid var(--action)}
.wave{height:22px;flex:1;border-radius:6px;background:repeating-linear-gradient(90deg,var(--action-soft) 0 2px,transparent 2px 5px)}
.track{display:flex;align-items:center;gap:8px;height:26px}.track span{width:62px;font:600 10px "JetBrains Mono",monospace;color:var(--ink3);text-transform:uppercase}
.track i{height:20px;border-radius:6px;background:var(--action-soft);border:.5px solid var(--action)}
.viewer{position:absolute;inset:0;background:var(--viewer);display:grid;grid-template-columns:1fr 280px;z-index:5;color:#f5f5f7}
.viewer .vm{padding:18px;display:flex;flex-direction:column;gap:12px;min-height:0}
.viewer .vs{background:#141824;border-left:.5px solid rgba(255,255,255,.12);padding:18px;display:flex;flex-direction:column;gap:12px}
.viewer .pane{background:#05070c;border-radius:12px;display:grid;place-items:center;color:#8a90a6;font-size:12px;position:relative;border:.5px solid rgba(255,255,255,.1)}
.viewer .pane em{position:absolute;left:10px;top:10px;font-style:normal;font:600 10px "JetBrains Mono",monospace;background:#fff;color:#111;border-radius:6px;padding:2px 7px}
.viewer .kb{display:inline-flex;gap:6px;align-items:center;font-size:11.5px;color:#aab0c4}.viewer .kb b{border:.5px solid rgba(255,255,255,.3);border-radius:5px;padding:1px 6px;font:600 10px "JetBrains Mono",monospace;color:#fff}
.tls{display:flex;gap:8px;padding:2px 8px 12px}.tls i{width:12px;height:12px;border-radius:50%;display:block}
.bub .tile{aspect-ratio:16/9}
.turn{display:flex;flex-direction:column;gap:8px}
.act{border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.act .st{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--ink2)}
.act .st b{color:var(--ink);font-weight:600}
.spin{width:12px;height:12px;border-radius:50%;border:2px solid var(--action-soft);border-top-color:var(--action);display:inline-block}
.bub{border-radius:14px;padding:10px 12px;max-width:88%}.bub.me{align-self:flex-end;background:var(--action);color:#fff}
.att{display:inline-flex;gap:6px;align-items:center;border-radius:8px;padding:3px 8px;font-size:11px;background:rgba(255,255,255,.22)}
.doc h3{font-size:22px;letter-spacing:-.4px;margin-bottom:6px}.doc h4{font-size:15px;margin:16px 0 6px}.doc p{color:var(--ink2);max-width:680px;margin-bottom:8px}
.doc kbd{font:600 11px "JetBrains Mono",monospace;border:.5px solid var(--line);border-radius:5px;padding:1px 6px;background:var(--glass-sub)}
.hero{position:relative;padding:40px 8% 0;display:flex;flex-direction:column;gap:22px}
.hero h1{font-size:54px;line-height:1.02;letter-spacing:-1.8px;font-weight:800;max-width:760px}
.hero p{font-size:17px;color:var(--ink2);max-width:560px;line-height:1.5}
.web{position:relative;height:100%;overflow:hidden;display:flex;flex-direction:column}
.webnav{margin:14px 6%;border-radius:999px;padding:8px 10px 8px 18px;display:flex;align-items:center;gap:22px;box-shadow:var(--shadow-card)}
.webnav a{color:var(--ink2);font-weight:500}
@media (prefers-reduced-transparency:reduce){.glass,.thick,.thin{backdrop-filter:none}}
</style>
</head>
<body>
<div class="bar"><b>Video Maker · Cristal Líquido · todas las vistas</b><span class="sp"></span><button id="light" aria-pressed="true">Light</button><button id="dark" aria-pressed="false">Dark</button></div>
<div id="root"></div>
<script>
const pill=(t,x)=>`<span class="pill ${t}"><i></i>${x}</span>`;
const tile=(l,r,x='')=>`<div class="tile ${x}">${l}${r?`<em>${r}</em>`:''}${x.includes('sel')?'<span class="ck">✓</span>':''}</div>`;
const field=(l,v,ph)=>`<div class="field"><b>${l}</b><div class="in sub ${ph?'ph':''}">${v}</div></div>`;
const nav=(on,video,step,win)=>{
  const steps=['Productor','Material','Storyboard','Voz','Vista previa'],st=['','ok','ok','ok','w'];
  const vblock=video?`<div class="vid thin"><div class="vt">${video}</div>${steps.map((s,i)=>`<a class="${s===step?'on':''}"><i class="n ${st[i]}"></i>${s}</a>`).join('')}</div>`:'';
  const it=(k,i,t,extra='')=>`<a class="${on===k?'on':''}"><span>${i}</span>${t}${extra}</a>`;
  return `<aside class="glass side">${win?'<div class="tls"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div>':''}<div class="brand"><span>▶</span>Video Maker</div><nav class="nav">
    <div class="cap">Producir</div>${it('videos','▦','Mis videos')}${vblock}${it('marcas','◐','Marcas')}
    <div class="cap">Salida</div>${it('pub','↑','Publicación','<span class="sp"></span>'+pill('warn','2'))}
    <div class="cap">Sistema</div>${it('ajustes','⚙','Ajustes')}${it('guia','?','Guía')}</nav><div class="sp"></div>
    <div class="foot thin"><span class="pill ok"><i></i>Listo</span><span class="pill thin">ES · EN</span></div></aside>`;
};
const tb=(t,sub,status,act,sec='')=>`<div class="tb thick"><h1>${t}</h1><small>${sub||''}</small><span class="sp"></span>${status||''}${sec}${act?`<button class="btn">${act}</button>`:''}</div>`;
const shell=(id,title,on,video,step,toolbar,content,over='',win=false)=>`<div class="label">${title}</div><div class="scene" id="${id}"><div class="bg"><i></i><i></i></div><div class="app">${nav(on,video,step,win)}<main class="main">${toolbar}${content}</main></div>${over}</div>`;
const V='Crear campaña display ads';
const S=[];

S.push(shell('marcas','Marcas · listado','marcas','','',
 tb('Marcas','5 marcas · 2 integradas','', '+ Crear marca'),
 `<div class="grid g3" style="gap:12px">${[['Display Ads','Integrada','#0ea5e9','#14b8a6','#09090b'],['Esteban Burgos','Propia','#6d4aff','#e11d48','#101322'],['Café Aroma','Propia','#c2410c','#f59e0b','#1c1410'],['Webs para negocios','Propia','#0a6cff','#00a8b5','#0b1020'],['Siochana Vision','Propia','#16a34a','#84cc16','#0a140d']].map(b=>
 `<div class="panel glass" style="gap:10px"><div class="stage" style="aspect-ratio:16/9;background:${b[4]}"><b style="color:#fff;font-size:15px">${b[0]}</b></div>
 <div class="h2row"><h2>${b[0]}</h2><span class="sp"></span><span class="pill ${b[1]==='Propia'?'teal':'thin'}">${b[1]}</span></div>
 <div style="display:flex;gap:6px"><i class="sw" style="background:${b[2]}"></i><i class="sw" style="background:${b[3]}"></i><i class="sw" style="background:${b[4]}"></i><span class="sp"></span><span class="note mono">Outfit · Inter</span></div>
 <div style="display:flex;gap:8px"><button class="btn sm">${b[1]==='Propia'?'Editar':'Ver'}</button><button class="btn sec sm">Duplicar</button><span class="sp"></span><span class="note">⋮</span></div></div>`).join('')}
 <div class="panel" style="border:1.5px dashed var(--line);align-items:center;justify-content:center;color:var(--action);font-weight:600">+ Nueva marca desde un logo</div></div>
 <p class="note">Una acción principal por tarjeta; borrar solo existe en el menú ⋮ y nunca en marcas integradas. La paleta se ve sin abrir la marca.</p>`));

S.push(shell('marca-editor','Marcas · editor','marcas','','',
 tb('Display Ads','Marca integrada','<span class="pill warn"><i></i>Solo lectura</span>','Duplicar para editar'),
 `<div style="display:grid;grid-template-columns:190px 1fr 380px;gap:12px;flex:1;min-height:0">
  <section class="panel glass" style="padding:10px;gap:2px">${['Identidad','Logo','Colores','Tipografías','Voz','Música','Fotos','Productos'].map((s,i)=>`<div class="row" style="border:0;padding:9px 10px;border-radius:10px;${i===0?'background:var(--action-soft);color:var(--action);font-weight:600':'color:var(--ink2)'}">${s}<span class="sp"></span>${i===2?'<i class="n ok"></i>':''}</div>`).join('')}</section>
  <section class="panel glass"><h2>Identidad</h2>
   ${field('Nombre','Display Ads')}${field('Nombre hablado','Display Ads')}<p class="note" style="margin-top:-6px">Cómo lo pronuncia la voz. Escribilo como suena.</p>
   ${field('Eslogan','Tus pantallas, bajo control.')}${field('Dirección web','displayads.com.ar')}
   <h2 style="margin-top:6px">Colores</h2>
   <div class="grid g4">${[['Fondo','#09090B'],['Acento','#0EA5E9'],['Acento 2','#14B8A6'],['Texto','#FAFAFA']].map(c=>`<div class="field"><b>${c[0]}</b><div class="in sub" style="display:flex;gap:8px;align-items:center"><i class="sw" style="background:${c[1]}"></i><span class="mono">${c[1]}</span></div></div>`).join('')}</div></section>
  <section class="panel glass"><div class="h2row"><h2>Vista previa</h2><span class="sp"></span><button class="btn sec sm">Actualizar</button></div>
   <div class="stage" style="aspect-ratio:16/9;background:#09090b"><b style="color:#fff;font-size:18px">Display Ads</b></div>
   <p class="note">Los colores se actualizan al instante; el logo y las tipografías recomponen. La vista previa va sobre escenario opaco.</p>
   <div class="grid g3">${tile('9:16','','')}${tile('1:1','','')}${tile('16:9','','')}</div></section></div>
  <div class="savebar thick"><span class="note">Cambios sin guardar: ninguno</span><span class="sp"></span><button class="btn sec">Descartar</button><button class="btn">Guardar marca</button></div>`));

S.push(shell('ajustes','Ajustes','ajustes','','',
 tb('Ajustes','Productor, voz, YouTube y apariencia','', 'Guardar cambios'),
 `<div class="seg thick"><span class="on">Productor</span><span>Voz</span><span>YouTube</span><span>Apariencia</span></div>
  <div class="grid g2" style="gap:12px;flex:1;min-height:0;align-content:start">
  <section class="panel glass"><h2>Motor del productor</h2>
   <div class="seg thin"><span class="on">Claude (suscripción)</span><span>OpenRouter</span></div>
   ${field('Modelo','Sonnet · Equilibrado, rápido y económico')}
   <p class="note">Con la suscripción de Claude no hace falta ninguna clave: el agente corre en esta máquina.</p></section>
  <section class="panel glass"><h2>Clave de OpenRouter</h2>${pill('ok','Guardada')}
   ${field('Clave','sk-or-••••••••••••••••8f2a')}
   <div style="display:flex;gap:8px"><button class="btn sec sm">Reemplazar</button><button class="btn red sm">Quitar</button><span class="sp"></span><a class="note" style="color:var(--action)">Obtener una clave ↗</a></div></section>
  <section class="panel glass"><h2>Apariencia</h2>
   <div class="field"><b>Tema</b><div class="seg thin"><span>Sistema</span><span class="on">Claro</span><span>Oscuro</span></div></div>
   <div class="field"><b>Materiales</b><div class="seg thin"><span class="on">Vidrio</span><span>Sólidos</span></div></div>
   <p class="note">«Sólidos» quita el desenfoque en equipos lentos. Se activa solo con «reducir transparencia» del sistema.</p>
   <div class="field"><b>Idioma</b><div class="seg thin"><span class="on">Español</span><span>English</span></div></div></section>
  <section class="panel glass"><h2>ElevenLabs y YouTube</h2>

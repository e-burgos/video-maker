services:
  minio:
    image: minio/minio:latest
    ports:
      - 9000:9000
      - 9001:9001
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: "${MINIO_USER:-admin}"
      MINIO_ROOT_PASSWORD: "${MINIO_PASSWORD:-admin123}"
    volumes:
      - minio_data:/data
volumes:
  minio_data:
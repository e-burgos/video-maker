    business_context: |
      El dev quiere disparar un render desde HTTP sobre un proyecto que ya tiene su Timeline en
      `media/<slug>/work/timeline.json`, ver en qué etapa va y qué porcentaje del render lleva sin
      quedarse mirando un proceso mudo, y bajarse el MP4 cuando termina. Un render de 1080x1920
      dura minutos: el progreso no es cosmético, es lo que distingue "está trabajando" de "se colgó".
      Concurrencia 1 es decisión del dev: la máquina no soporta dos renders simultáneos.

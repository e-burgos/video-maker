cycle: 3
module: render-service
phase: render-job-queue-and-delivery
date: 2026-09-08
flow: full
app_context: sdd/context/apps/render-api/context_prompt.md

objective: |
  `runRenderPipeline` deja de ser una función sin llamador: `apps/render-api` expone una cola de
  jobs de render en proceso con concurrencia 1, con creación, consulta de estado con progreso por
  etapa y por frame, listado y cancelación. El entregable y los intermedios quedan bajo
  `media/<slug>/out/` y `media/<slug>/work/renders/<renderId>/` (D-8) y se descargan por el
  endpoint de artefactos ya existente (EP-011). El ciclo cierra la spec: incluye el **smoke real
  E2E obligatorio** (job disparado por HTTP sobre un proyecto real de `media/`, MP4 verificado con
  `ffprobe` contra el stream de video), que es además la primera verificación de que el bundle
  webpack de Remotion bundlea (D-10, declarado no verificado desde `cycle-01`).

scope:
  - Cola en proceso, concurrencia 1, sin dependencias npm nuevas: registro de jobs en memoria,
    despacho FIFO, un único job `running` a la vez.
  - Endpoints nuevos de jobs: crear un render sobre un proyecto, consultar uno por id, listar los
    del proyecto y cancelar. Rutas y verbos exactos los fija el architect (EP-012..EP-0NN).
  - Progreso: etapa vigente (`prepare|render|mix|mux|verify`) y porcentaje del render vía el
    callback `onProgress(renderedFrames, totalFrames)` que `renderTimeline` ya expone y que el
    puerto `RenderMutedVideoPort` de `render-api` todavía **no** propaga.
  - Cancelación con semántica explícita decidida por el architect (al menos: un job `queued` se
    cancela de verdad; un job `running` no se puede interrumpir a mitad de un binario, así que la
    semántica tiene que estar escrita y testeada, no implícita).
  - El job lee la `Timeline` del proyecto desde el store (`work/timeline.json`) por el puerto
    `ObjectStorage`, no por un body arbitrario, salvo que el architect justifique lo contrario.
  - Superficie de errores ampliada con los códigos de la cola, cada uno con su etapa y status HTTP,
    payload en inglés (D-4), sin `.stack` ni rutas absolutas (RNF-6).
  - `GET /health` refleja la capacidad nueva de la cola.
  - Smoke real E2E ejecutado y con su salida literal guardada en `cycles/cycle-03/artifacts/`.
  - `FIX-e-burgos-001-001` pasa a `validated` en `sdd/fixes.json` una vez que el render real por job
    pasó (es el fix que hizo posible cualquier render real en este repo).
  - Ampliación de `coverage.include` de `libs/composition-remotion/vite.config.ts` a `src/render.ts`
    y `src/components/**` (D-6), vía FIX GATE `[IMPROVEMENT]`.
  - Follow-ups heredados de `tools/render-cli` (N-2 token genérico `[uso]`, salida bilingüe), vía
    FIX GATE `[IMPROVEMENT]` con `profile: solo`; lo que no entre queda descopado por escrito.
  - README de `apps/render-api` actualizado y cierre de la spec en los registros SDD.

out_of_scope:
  - MinIO / S3 y URLs firmadas: siguen descopados con fundamento (D-11). El puerto `ObjectStorage`
    conserva su único adaptador `fs`.
  - Concurrencia > 1, workers en procesos separados y cualquier lock entre procesos. El riesgo ya
    está documentado en el README de `cycle-02` ("Known risk"); subirlo es otra spec.
  - Persistencia de los jobs en disco entre reinicios: la cola es en memoria y el README lo declara.
  - `apps/render-api/eslint.config.mjs` (D-9): sigue sin crearse; el hook `config-protection` lo
    bloquea y rodearlo con `Bash` anularía el guardrail.
  - Cualquier UI: `apps/web` es `spec-e-burgos-006`, que no se abre en este ciclo.
  - Re-master del integrado y reintentos ante `withinTolerance: false`: D-7 sigue vigente (se
    publica el entregable y se reporta el delta).

dependencies_required:
  - spec-e-burgos-005-render-service cycle-01 (completed) — `runRenderPipeline`, superficie de
    errores, servidor `node:http`, puertos inyectables.
  - spec-e-burgos-005-render-service cycle-02 (completed) — store sobre `media/`, router con
    parámetros, `ObjectStorage`, persistencia de `Timeline`/`EDL`, descarga con `Range`.
  - spec-e-burgos-001 / 002 / 004 (completed) — `renderTimeline`, `mixTimelineAudio`,
    `muxAudioIntoVideo`, `verifyMixLoudness` y la capa de proyecto de `auto-montage`.
  - FIX-e-burgos-001-001 (implemented) — sin él no hay render real posible; este ciclo lo valida.


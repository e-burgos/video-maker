  api_publica_a_consumir: |
    composition-remotion/render: renderTimeline(timeline, options, deps) con options.audio = 'muted'
      (TimelineAudioMode). Errores: RenderTimelineError con INVALID_TIMELINE | BUNDLE_FAILED |
      COMPOSITION_NOT_FOUND | RENDER_FAILED.
    media-local: ExecaCommandRunner, resolveBinary, mixTimelineAudio, verifyMixLoudness,
      muxAudioIntoVideo, MissingMediaStreamError, isMediaLocalError.
    Orden de llamadas y tabla de errores completa:
      sdd/specs/spec-e-burgos-004-audio-mix-mastering/cycles/cycle-02/architect.md seccion 15.
      Leer esa seccion entera antes de disenar; NO copiar de ella ningun literal de filtergraph
      (la seccion 4.3 de ese documento tiene una errata registrada).
  reglas_operativas_del_repo: |
    - publicDir = raiz del proyecto de medios, nunca raw/ (rama verificada de assetSrc).
    - Todo alias @video-maker/* se declara en CADA resolvedor (tsconfig, vite, webpack de Remotion).
    - Cualquier runner Node de un .ts que llegue a bundlear Remotion usa el patron cli-register.cjs
      de tools/render-cli (preserva el loader nativo de .js).
    - SWC_NODE_PROJECT apunta a un tsconfig con baseUrl en la raiz del workspace en todo target
      nx:run-commands con cwd de proyecto.
    - Verificar un exit code exacto invocando el binario, nunca via nx run.
    - Nunca render y transcripcion a la vez; gate de memoria antes de cualquier render.


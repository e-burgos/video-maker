objective: |
  Poner de pie la app apps/render-api y darle la unica capacidad que ningun otro subproyecto del
  monorepo puede tener: orquestar render -> mix -> mux -> verify en una sola llamada. El ciclo
  entrega la app ejecutable, sus puertos inyectables, el pipeline orquestador, la superficie de
  errores tipada en ingles con su mapeo a HTTP y un servidor node:http con GET /health. No entrega
  cola de jobs, ni endpoints de assets, ni MinIO: esos son cycle-02 y cycle-03.

scope:
  - Scaffold de apps/render-api con generador Nx, auditado en la misma task (package.json, nx.json, placeholders de src/) y verificado con una ejecucion real (RF-1, CA-001, CA-002)
  - Puertos inyectables del servicio y su unico adaptador de produccion, con await import() dinamico de las dos libs pesadas (RF-2)
  - runRenderPipeline - render audio muted -> mixTimelineAudio -> muxAudioIntoVideo -> verifyMixLoudness, mkdir previo, intermedios conservados (RF-3, CA-003, CA-005)
  - Superficie de errores tipada propia que traduce la tabla de spec-004 architect 15.2 a codigo + etapa + status HTTP, payload en ingles (RF-4, CA-004, D-4)
  - Servidor node:http con router, GET /health, JSON en todos los caminos y manejador central de errores (RF-5)
  - Politica ante withinTolerance false - publicar y reportar el delta, sin reintento ni excepcion (RF-6, CA-006, D-7)
  - README del subproyecto con comandos, variables de entorno y alcance descopado (RF-7, CA-008)

out_of_scope:
  - Cola de jobs, concurrencia, progreso y cancelacion - cycle-03
  - Endpoints de assets, upload, probe y persistencia de Timeline/EDL - cycle-02
  - MinIO, docker-compose y cualquier cliente S3 - cycle-02 (D-3)
  - Dependencias npm nuevas de cualquier tipo (RNF-1, D-2)
  - Crear apps/render-api/eslint.config.mjs - descopado por el hook config-protection (D-9)
  - Tocar tsconfig.base.json - una app no necesita alias propio; si hiciera falta se escala con el diff (RNF-5)
  - Tocar tools/render-cli - N-2 y su salida bilingue se agendan para cycle-03 (D-5)
  - Tocar coverage.include de libs/composition-remotion - se amplia en cycle-03 (D-6)
  - Bundlear Remotion con webpack - se ejercita en el smoke E2E de cycle-03, declarado no verificado en este ciclo (D-10)
  - Re-master del integrado del bus completo - fuera del alcance de la spec por ahora (spec-004 D-K)


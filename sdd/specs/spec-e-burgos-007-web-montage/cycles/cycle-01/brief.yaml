# sdd/specs/spec-e-burgos-007-web-montage/cycles/cycle-01/brief.yaml
# Generado por: sdd-orchestrator
# Al: iniciar el ciclo

cycle: 1
module: web-montage
phase: montage-job-api
date: 2026-09-09
flow: full
app_context: sdd/context/apps/render-api/context_prompt.md

objective: |
  apps/render-api gana un segundo tipo de job en la MISMA cola (kind: 'montage') que ejecuta
  sobre media/<slug>/ el equivalente exacto de `render-cli ingest` + `render-cli plan` llamando a
  la API pública de libs/auto-montage, con progreso por etapa, overwrite explícito y errores
  tipados, y produce work/catalog.json, work/timeline.json y work/edl.json con el MISMO sha256
  que la CLI. Al cerrar el ciclo, un proyecto creado desde apps/web puede pasar de raw/ a un MP4
  sin tocar la terminal — el disparo desde la UI es cycle-02.

scope:
  - Discriminante `kind: 'render' | 'montage'` en el body de POST /projects/:slug/jobs, con
    `render` por default cuando el body está ausente, vacío o sin `kind` (retro-compatibilidad
    literal con lo que apps/web manda hoy).
  - Parámetros del job de montaje: `preset` (presets de libs/auto-montage, default
    `software-demo`), `seed` (entero no negativo, default 0) y `overwrite` (boolean, default false).
  - Ejecución de la secuencia del CLI: precondición de proyecto ingestable → resolución de los
    cuatro binarios → ingestProject → precondición de catálogo → autoMontage.
  - Progreso por etapa `discover | probe | transcribe | plan` por el mismo mecanismo que el job de
    render (GET /jobs/:jobId → progress), con contadores de assets cuando el total es conocido.
  - Rechazo 409 con código tipado propio si el proyecto ya tiene work/timeline.json y el pedido no
    trae `overwrite: true`, sin registrar job y sin tocar disco.
  - `kind` visible en GET /jobs/:jobId y en GET /projects/:slug/jobs; cancelación cooperativa de un
    job de montaje con la semántica ya vigente.
  - Los cuatro binarios (ffmpeg, ffprobe, whisper-cli y el modelo de Whisper) resueltos por el
    adaptador de producción y reportados por GET /health, más capabilities.montageQueue.
  - Registro del contrato en sdd/api.json (endpoints tocados → status "updated" + changelog).
  - README de apps/render-api: tipo de job, parámetros, etapas, códigos, cómo el binario recibe las
    variables del .env raíz, y el guion copiable del smoke real.
  - Smoke real ejecutado: job montage sobre una copia temporal de media/smoke-ingest SIN work/,
    comparación de sha256 contra los artefactos de la CLI, prueba de que el oráculo es sensible, y
    un job render encadenado verificado con ffprobe contra el stream de video.

out_of_scope:
  - Cualquier archivo de apps/web (es cycle-02). `git diff --stat apps/web` vacío al cerrar.
  - Modificar libs/auto-montage, libs/media-local, libs/timeline-core o
    libs/composition-remotion. Se consumen tal como están.
  - Un endpoint HTTP nuevo, si el arquitecto ratifica D-2 (un solo endpoint de jobs con
    discriminante).
  - Persistencia de la cola entre reinicios, cap de historial, concurrencia > 1 y workers en
    procesos separados (D-12, descopados con fundamento desde spec-005).
  - Lock entre procesos para el store (riesgo conocido y documentado; este ciclo no lo empeora).
  - Tocar el campo `cycle` de GET /health (D-8) y crear apps/render-api/eslint.config.mjs (D-11).
  - Editar sdd/tasks.json a mano (se regenera con pnpm sdd:rebuild-tasks-index).

dependencies_required:
  - spec-e-burgos-002-auto-montage-pipeline (completed) — ingestProject, autoMontage, presets
  - spec-e-burgos-005-render-service (completed) — cola de jobs, store, EP-001..EP-015
  - spec-e-burgos-006-web-studio (completed) — el consumidor de cycle-02

agent_contexts:
  functional:
    goal: |
      Convertir el objetivo del ciclo en historias de usuario y reglas de negocio para UN actor
      (el dev en su máquina, operando por HTTP) más UN consumidor de máquina (apps/web en
      cycle-02). Tiene que dejar explícitas: la regla de default (`render` sin `kind`), la regla de
      sobreescritura (409 sin `overwrite`), la semántica de las cuatro etapas (monotónicas y
      SALTEABLES) y qué se observa en cada estado del job. NO decide forma de payload ni rutas:
      eso es del arquitecto.
    business_context: |
      El producto es local y mono-usuario. Hoy el Web Studio puede crear un proyecto y subir
      material, pero la Timeline sólo la produce tools/render-cli, así que un proyecto creado desde
      la web no tiene preview, ni edición, ni render (POST de un job de render responde 404
      TIMELINE_NOT_FOUND). El pedido del dev es "usar web-studio para todo". La etapa lenta es la
      transcripción con Whisper: por eso el progreso por etapa es requisito, no adorno. Regenerar
      un montaje sobre un proyecto ya editado a mano DESTRUYE ese trabajo: de ahí el overwrite
      explícito.
    relevant_spec_sections:
      - Resumen Ejecutivo
      - Evidencia y decisiones (las cuatro primeras entradas)
      - Decisiones del orquestador D-2, D-5, D-6
      - Requisitos Funcionales · Ciclo 01 (RF-1..RF-13)
    output_file: sdd/specs/spec-e-burgos-007-web-montage/cycles/cycle-01/functional.md

  architect:

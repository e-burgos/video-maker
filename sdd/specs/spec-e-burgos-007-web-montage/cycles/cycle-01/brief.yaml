      - EP-013 GET /projects/:slug/jobs (summary por job; suma `kind`)
      - EP-014 GET /jobs/:jobId (detalle completo; suma `kind` y las etapas de montaje)
      - EP-015 DELETE /jobs/:jobId (cancelación cooperativa; vale igual para montage)
    must_read:

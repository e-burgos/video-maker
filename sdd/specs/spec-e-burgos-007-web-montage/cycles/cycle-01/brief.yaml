      Definir el contrato completo y la lista cerrada de archivos. Decisiones que le toca ratificar
      o rebatir con evidencia: (1) D-2, un solo endpoint de jobs con discriminante `kind` frente a
      un endpoint nuevo; (2) D-5, observar las etapas decorando el CommandRunner inyectado (clasificar
      por la ruta de binario YA resuelta, nunca por substring del nombre del comando) frente a
      cualquier alternativa que toque libs/auto-montage o que reimplemente la secuencia; (3) los
      códigos de error nuevos y su mapeo HTTP (incluido el 409 de D-6); (4) cómo entra el
      montaje al modelo de la cola sin romper ningún campo ya publicado de RenderJob; (5) qué
      puertos nuevos entran a RenderApiDependencies (CommandRunner, resolución de los cuatro
      binarios, lectores de directorio/stat/texto y escritores que ingestProject y autoMontage
      exigen) sin dejar estado de módulo. Tiene que emitir la LISTA DE TESTS OBLIGATORIOS POR CA
      y el guion literal del smoke real. Corre ANTES del planner.

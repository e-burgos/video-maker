  implementor_back:
    goal: |
      Implementar una task a la vez del tasks.json del ciclo, respetando el contrato del arquitecto
      al pie de la letra. Cero comentarios; identificadores, payloads y README en inglés. Todo I/O
      nuevo por puertos inyectables: la suite tiene que seguir corriendo sin ffmpeg, ffprobe,
      whisper-cli ni Chrome. Ningún archivo de apps/web. Tests rojos no se ajustan: se reportan.
    app: apps/render-api
    app_context: sdd/context/apps/render-api/context_prompt.md

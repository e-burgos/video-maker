      - 'El orden de claves de JSON.stringify tras un .parse() de Zod no es el del literal: si un CA depende de bytes identicos, se verifica con test.'
      - 'ESLint de la lib prohibe Date, process y Math.random fuera de src/smoke.ts: toda variacion entra por seed.'
      - 'vite.config.ts necesita resolve.alias de CADA alias @video-maker/* que la lib importe: tsc resuelve por tsconfig.base.json -> paths, Vitest NO.'

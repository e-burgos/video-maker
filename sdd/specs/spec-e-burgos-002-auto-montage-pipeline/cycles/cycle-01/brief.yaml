cycle: 1
module: auto-montage-pipeline
phase: media-project-ingest
date: 2026-09-07
app_context: sdd/context/libs/auto-montage/context_prompt.md

objective: |
  Crear libs/auto-montage y dejar operativa la ingesta de un proyecto de medios: dado un árbol
  media/<project-slug>/raw/, descubrir y clasificar los assets, sondearlos con probeMedia,
  transcribir el A-roll con whisper-cli de forma incremental y persistir un catálogo con rutas
  relativas en work/. Al cerrar, `ingerir una carpeta de material real` es una operación
  reproducible y testeada, sin binarios en CI.

scope:
  - Scaffold de libs/auto-montage con la skill scaffold-nx (targets explícitos lint/test/build, alias @video-maker/auto-montage en tsconfig.base.json Y resolve.alias en vite.config.ts)
  - Contrato del proyecto de medios: resolución de media/<project-slug>/{raw,work,out}, invariante de raw/ como solo lectura (error tipado ante cualquier escritura)
  - Descubrimiento y clasificación de assets por subcarpeta (aroll/broll/images/audio), ignorando ocultos y extensiones no soportadas
  - Probe de cada asset vía probeMedia de media-local, tolerante a fallos individuales
  - Transcripción incremental del A-roll vía transcribeWithWhisperCpp, persistida en work/transcripts/ y no repetida si el material no cambió
  - Catálogo work/catalog.json con schema Zod propio y rutas SIEMPRE relativas a la raíz del proyecto de medios
  - Puertos inyectables de I/O (CommandRunner + puerto de filesystem) para que la suite corra sin binarios
  - Target de smoke manual documentado en el README que ingiere un proyecto real con los binarios de la máquina
  - Contexto del subproyecto: fragmento aditivo en sdd/context/libs/auto-montage/updates/

out_of_scope:
  - Keyword spotting, planificador de B-roll, presets y autoMontage() → cycle-02
  - tools/render-cli y cualquier render → cycle-03 (su contexto ya quedó sembrado, no se toca la lib)
  - Mezcla de audio y mux final → spec-e-burgos-004
  - Cualquier matching semántico con embeddings o LLM (fuera de la spec entera)
  - Modificar libs/timeline-core, libs/media-local o libs/composition-remotion (specs ya cerradas; si hiciera falta, se registra como decisión, no se toca de prepo)

dependencies_required:
  - spec-e-burgos-001-core-composition-media-pipeline (completed — 3 ciclos, 2026-09-07)
  - libs/timeline-core (contratos MediaAsset/Transcription)
  - libs/media-local (probeMedia, transcribeWithWhisperCpp, CommandRunner)

agent_contexts:
  functional:
    goal: >
      Convertir la ingesta del proyecto de medios en historias de usuario y criterios de aceptación
      verificables. El actor es el propio dev operando su máquina: no hay multiusuario ni UI en este
      ciclo. Prestar atención especial al comportamiento ante material parcialmente ilegible y a la
      incrementalidad (qué significa exactamente "el material no cambió").
    business_context: >
      El creador tiene una carpeta con el material crudo de un video (clips de cámara o pantalla con
      locución, clips de apoyo, fotos, música). Hoy, para editar, tiene que mirar todo el material y
      decidir a mano. Este ciclo entrega el primer paso automático: que el sistema lea esa carpeta y
      sepa qué hay adentro y qué se dijo. La transcripción es cara (minutos de whisper-cli sobre un
      modelo de 574 MB): re-transcribir material que no cambió es el desperdicio que este ciclo debe
      evitar.
    relevant_spec_sections:
      - 'Contexto de Negocio → Contrato de entrada: layout de media/'
      - 'Alcance → punto 1 (Proyecto de medios y catálogo)'
      - 'Requisitos Funcionales → RF-1 a RF-4'
      - 'Requisitos No-Funcionales → RNF-3, RNF-4, RNF-5'
      - 'Criterios de Aceptación → CA-001 a CA-007'

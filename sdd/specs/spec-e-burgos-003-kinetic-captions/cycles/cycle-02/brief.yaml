  functional:
    goal: Escribir las historias del creador y del desarrollador integrador para que los subtítulos se muevan — aparezcan y salgan con energía, sigan la voz palabra por palabra y destaquen la palabra clave — con reglas de negocio verificables y sin detalle de implementación
    business_context: |
      El creador ya tiene los subtítulos bien puestos y bien vestidos (cycle-01), pero quietos: un
      bloque de texto que aparece y desaparece de golpe. Lo que hace que un Reel retenga es el
      movimiento — la palabra entra con un rebote, la palabra que se está diciendo se ilumina, la
      palabra clave queda destacada toda la frase. Además quiere poder mirar los cuatro looks lado
      a lado antes de elegir, sin renderizar un video entero.

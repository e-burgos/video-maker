cycle: 2
module: kinetic-captions
phase: kinetic-captions-component
date: 2026-09-07
app_context: sdd/context/libs/composition-remotion/context_prompt.md

objective: |
  Al cerrar el ciclo, `libs/composition-remotion` renderiza kinetic typography de verdad: el
  componente `<KineticCaptions />` monta una `Sequence` por clip de `tracks.captions`, anima la
  entrada y la salida del bloque de palabras con `spring`, resalta la palabra activa según el
  timing por palabra y mantiene el estilo de impacto en `emphasisIndex` durante todo el clip.
  `TimelineComposition` pasa a montarlo y `CaptionTrack` desaparece del barrel. `Root.tsx` gana
  una composición de galería para inspeccionar los cuatro presets en `remotion studio`. Con esto
  la spec `spec-e-burgos-003` queda completa.

scope:
  - `src/helpers/caption-animation.ts` — `captionClipAnimation({ frame, durationInFrames, fps, preset })` con `spring()`/`interpolate()` de `remotion` como funciones puras (RF-6, CA-006)
  - `src/helpers/caption-active-word.ts` — `activeWordIndex(frame, words)` sobre `word.fromFrame` / `word.durationFrames` (RF-7, CA-007)
  - `src/components/kinetic-captions.tsx` — `<KineticCaptions />` consumiendo `readonly CaptionSequenceProps[]` + `preset`, `platform` y `anchor` opcionales (RF-8, CA-008, CA-009)
  - `TimelineComposition` monta `KineticCaptions`; `CaptionTrack` se elimina del barrel y su registro COMP-003 se actualiza en `sdd/components.json` (D-D)
  - Resolver R-9 del architect de cycle-01: dos fuentes para la caja (`clip.box` de la Timeline vs `captionBoxFor`) — fijar la precedencia y testearla
  - Resolver R-8: el `transform` de `captionWordStyle` (solo `scale`) tiene que componer con el transform del contenedor animado, sin pisarse
  - Reemplazar en `caption-safe-zone.spec.ts` el uso de `captionLayout` por `captionBoxFor` para verificar contención (deuda declarada en el fragmento de cycle-01)
  - `Root.tsx`: composición de galería de presets para `remotion studio` (RF-9, CA-010)
  - Smoke render manual UNA sola vez al final del ciclo, con chequeo previo de `memory_pressure`
  - Fragmento aditivo de contexto y cierre de la spec

out_of_scope:
  - Cualquier cambio en `libs/timeline-core` o en el contrato `Timeline` (D-A, RNF-4)
  - `OffthreadVideo` vs `Video` para el `<Player>` de browser — es de `spec-006`
  - Consumo desde `apps/web` (spec-006), mezcla de audio (spec-004)
  - Commitear archivos de fuente tipográfica (RNF-5)
  - Medir `averageCharWidthEm` o los insets de chrome contra capturas reales de las apps (queda como follow-up)

dependencies_required:
  - cycle-01 de esta spec (completed) — `CAPTION_PRESETS`, `captionSafeZone`, `captionBoxFor`, `fitCaptionFontSize`, `captionWordStyle`, `captionFontFaceCss`
  - spec-e-burgos-001 (completed) — `CaptionSequenceProps`, `timelineToSequenceProps`, `TimelineComposition`


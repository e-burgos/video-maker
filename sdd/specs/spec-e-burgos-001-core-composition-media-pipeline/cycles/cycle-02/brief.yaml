cycle: 2
module: core-composition-media-pipeline
phase: media-local-wrappers-and-parsers
date: 2026-09-07
app_context: sdd/context/libs/media-local/context_prompt.md

objective: |
  Al cerrar el ciclo existe `libs/media-local`: la lib Node que envuelve los binarios locales
  (ffprobe, ffmpeg, whisper-cli) con un `CommandRunner` inyectable, parsea su salida con
  funciones puras hacia los contratos de `@video-maker/timeline-core` (`MediaAsset`,
  `SilenceRange`, `Transcription`, mediciones de loudness) y se prueba con fixtures grabadas,
  sin ningún binario instalado en CI.

scope:
  - Scaffold de `libs/media-local` con `scaffold-nx` (`@nx/js:lib`, vitest, tags scope:engine/type:util; targets explícitos lint/test/build=tsc como en timeline-core; sin plugins inferidos en nx.json)
  - `CommandRunner` (interfaz) + `ExecaCommandRunner` (real, sobre `execa`) + `FixtureCommandRunner` (tests) + errores tipados `BinaryNotFoundError`, `CommandFailedError` (stderr truncado a 2 KB), `UnparseableOutputError`
  - `resolveBinaries(env)`: FFMPEG_PATH / FFPROBE_PATH / WHISPER_CPP_PATH / WHISPER_MODEL_PATH con fallback al PATH
  - `probeMedia` + `parseFfprobeJson` (video con rotación de celular, imagen, audio) → `MediaAsset`
  - `detectSilencesWithFfmpeg` + `parseSilenceDetect` (silencio abierto al final cerrado en durationMs)
  - `measureLoudness` (loudnorm print_format=json) y `normalizeVoice` (dos pasadas con measured_*) hacia AudioMixPlan.voice
  - `extractAudioForTranscription` (wav 16 kHz mono pcm_s16le)
  - `transcribeWithWhisperCpp` (whisper-cli -oj -ml 1) + `parseWhisperCppJson` + `parseFasterWhisperJson` → `Transcription` normalizada
  - Fixtures reales grabadas en `src/__fixtures__/` (ffprobe JSON ×3, silencedetect stderr, loudnorm JSON, whisper.cpp JSON, faster-whisper JSON del mismo audio)
  - Criterios de aceptación CA-017 a CA-022 de la spec en verde con cobertura ≥ 80 %
  - README con matriz de binarios, versiones mínimas y variables de entorno; contexto SDD de la lib vía fragmento aditivo

out_of_scope:
  - Render de video y componentes Remotion (cycle-03)
  - Mezcla final multi-pista, filtergraphs de ducking y mux (spec-004)
  - Descarga o instalación automática de binarios o modelos
  - Invocar Faster-Whisper (solo se parsea su JSON)
  - Cualquier ejecución real de ffmpeg/whisper en tests o CI

dependencies_required:
  - cycle-01 de esta spec (completed) — `@video-maker/timeline-core` provee los contratos y `SilenceRange`


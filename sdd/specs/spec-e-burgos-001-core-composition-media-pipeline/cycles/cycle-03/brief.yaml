cycle: 3
module: core-composition-media-pipeline
phase: composition-remotion-base
date: 2026-09-07
app_context: sdd/context/libs/composition-remotion/context_prompt.md

objective: |
  Al cerrar el ciclo existe `libs/composition-remotion`: la lib React 19 + Remotion 4 que
  renderiza una `Timeline` de `@video-maker/timeline-core` (pistas A-roll, B-roll, voz, música y
  captions mínimos) con `TransitionSeries` y timings `spring`/`linear` (fade, slide, whip-pan;
  light-leak degradado a fade), expone helpers puros testeables sin montar Remotion
  (`timelineToSequenceProps`, `transitionTiming`, `punchInStyle`, `captionLayout`) y una entrada
  Node `renderTimeline` para render headless, verificada con un smoke manual fuera de CI.

scope:
  - Scaffold de `libs/composition-remotion` con `scaffold-nx` (`@nx/react:lib`, vitest + jsdom, tags scope:engine/type:ui; targets explícitos lint/test/build=tsc; sin plugins inferidos)
  - Dependencias: `remotion`, `@remotion/transitions`, `@remotion/bundler`, `@remotion/renderer`, `@remotion/cli` en versión exacta única (4.0.521 o la vigente al instalar); `@testing-library/react` + `jsdom` en dev
  - Helpers puros: `timelineToSequenceProps`, `transitionTiming`, `punchInStyle`, `captionLayout` con tests sin render (CA-023..CA-026)
  - Componentes: `TimelineComposition` (con `calculateMetadata`), `ArollSeries` (TransitionSeries + presentaciones fade/slide/whip-pan propia), `BrollTrack`, `AudioTrack` (voz + música con automation de ganancia), `CaptionTrack` mínimo dentro del safe zone
  - `Root.tsx` con composiciones de ejemplo 9:16 y 16:9 para `remotion studio` (uso local)
  - `renderTimeline(timeline, { outPath, codec })` en Node vía `@remotion/bundler` + `@remotion/renderer`
  - Target `smoke` (manual, fuera de CI) documentado en README (CA-027) con `--concurrency=4`
  - Fixture propia: la Timeline de CA-013 construida con `buildTimeline` desde una EDL local (la API pública de timeline-core no expone fixtures; decisión de este brief)
  - Contexto SDD de la lib vía fragmento aditivo

out_of_scope:
  - Kinetic typography visual, fuentes y presets de estilo (spec-003)
  - Mezcla final y mastering con FFmpeg (spec-004)
  - Matching de B-roll y presets por caso de uso (spec-002)
  - Player/preview en apps/web (spec-006)
  - Ejecutar render real o descargar Chrome Headless Shell en tests o CI

dependencies_required:
  - cycle-01 y cycle-02 de esta spec (completed) — contratos de timeline-core; media-local no se consume en este ciclo


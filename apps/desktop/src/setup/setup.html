<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'"
    />
    <title>Video Maker — Primer arranque</title>
    <style>
      :root {
        color-scheme: light dark;
        --scene: linear-gradient(150deg, #c7d4ee, #e2d5ea 45%, #f2ded3);
        --panel: rgba(255, 255, 255, 0.62);
        --panel-line: rgba(255, 255, 255, 0.8);
        --text: #14172a;
        --muted: #5a6078;
        --accent: #0a6cff;
        --accent-text: #ffffff;
        --track: rgba(20, 23, 42, 0.12);
        --field: rgba(255, 255, 255, 0.55);
        --button-bg: rgba(255, 255, 255, 0.7);
        --button-line: rgba(20, 23, 42, 0.14);
        --ok: #1f8a3a;
        --error: #c92f3b;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --scene: linear-gradient(160deg, #101322, #1d1730 60%, #231b26);
          --panel: rgba(44, 44, 56, 0.62);
          --panel-line: rgba(255, 255, 255, 0.14);
          --text: #eef0f6;
          --muted: #a4abc0;
          --accent: #409cff;
          --accent-text: #06101f;
          --track: rgba(255, 255, 255, 0.14);
          --field: rgba(10, 12, 22, 0.45);
          --button-bg: rgba(255, 255, 255, 0.08);
          --button-line: rgba(255, 255, 255, 0.18);
          --ok: #59c26a;
          --error: #ff7a85;
        }
      }
      * {
        box-sizing: border-box;
      }
      html {
        min-height: 100%;
        background: var(--scene) fixed;
      }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        color: var(--text);
        display: flex;
        justify-content: center;
        padding: 56px 16px 32px;
      }
      .drag-region {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 44px;
        -webkit-app-region: drag;
      }
      main {
        width: 100%;
        max-width: 560px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 20px;
      }
      .brand svg {
        width: 40px;
        height: 40px;
        flex: none;
      }
      .brand h1 {
        margin: 0;
      }
      .brand-signature {
        color: var(--muted);
        font-size: 12px;
        margin: 0;
      }
      h1 {
        font-size: 18px;
        font-weight: 600;
        margin: 0 0 4px;
      }
      p.subtitle {
        color: var(--muted);
        margin: 0 0 24px;
        font-size: 13px;
      }
      .steps {
        display: flex;
        gap: 8px;
        margin-bottom: 20px;
      }
      .steps span {
        flex: 1;
        height: 4px;
        border-radius: 2px;
        background: var(--track);
      }
      .steps span.active {
        background: var(--accent);
      }
      section.panel {
        background: var(--panel);
        border: 0.5px solid var(--panel-line);
        -webkit-backdrop-filter: blur(24px) saturate(1.4);
        backdrop-filter: blur(24px) saturate(1.4);
        border-radius: 16px;
        padding: 20px;
        display: none;
      }
      section.panel.visible {
        display: block;
      }
      .item-row {
        margin-bottom: 12px;
      }
      .item-row .label {
        display: flex;
        justify-content: space-between;
        font-size: 13px;
        margin-bottom: 4px;
      }
      .bar {
        height: 8px;
        border-radius: 4px;
        background: var(--track);
        overflow: hidden;
      }
      .bar > i {
        display: block;
        height: 100%;
        width: 0%;
        background: var(--accent);
        transition: width 120ms linear;
      }
      .bar.ok > i {
        background: var(--ok);
      }
      .total-row {
        margin-top: 16px;
        padding-top: 16px;
        border-top: 1px solid var(--track);
        font-size: 13px;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
      }
      button {
        font: inherit;
        border-radius: 10px;
        border: 1px solid var(--button-line);
        background: var(--button-bg);
        color: var(--text);
        padding: 8px 14px;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      button.primary {
        background: var(--accent);
        color: var(--accent-text);
        border-color: var(--accent);
        font-weight: 600;
      }
      button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      button.link {
        background: none;
        border: none;
        color: var(--accent);
        text-decoration: underline;
        padding: 0;
      }
      .folder-path {
        font-size: 12px;
        color: var(--muted);
        word-break: break-all;
        background: var(--field);
        padding: 8px 10px;
        border-radius: 8px;
      }
      .status-badge {
        font-size: 12px;
        padding: 2px 8px;
        border-radius: 999px;
        display: inline-block;
      }
      .status-badge.ok {
        background: color-mix(in srgb, var(--ok) 16%, transparent);
        color: var(--ok);
      }
      .status-badge.error {
        background: color-mix(in srgb, var(--error) 16%, transparent);
        color: var(--error);
      }
      .actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <div class="drag-region"></div>
    <main>
      <div class="brand">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" aria-hidden="true"><defs><linearGradient id="mg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff5470"/><stop offset="1" stop-color="#7c5cff"/></linearGradient><linearGradient id="mh" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".4"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/></linearGradient><filter id="ms" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#2a1a6e" flood-opacity=".35"/></filter></defs><rect rx="29" fill="url(#mg)"/><rect rx="29" fill="url(#mh)"/><rect x=".75" y=".75" width="126.5" height="126.5" rx="28.5" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="1.5"/><circle cx="64" cy="64" r="44" fill="#fff" fill-opacity="0.2" stroke="#fff" stroke-opacity=".85" stroke-width="2.5"/><path d="M27.4 50.7A39 39 0 0 1 47.5 28.7" fill="none" stroke="#fff" stroke-opacity=".9" stroke-width="5" stroke-linecap="round"/><g filter="url(#ms)"><g stroke-linecap="round" fill="none" stroke-width="14"><path d="M45 45 64 88" stroke="#fff" stroke-opacity="0.95"/><path d="M83 45 64 88" stroke="#fff" stroke-opacity="0.55"/></g></g></svg>
        <div>
          <h1 data-i18n="title"></h1>
          <p class="brand-signature">by Esteban Burgos</p>
        </div>
      </div>
      <p class="subtitle" data-i18n="subtitle"></p>
      <div class="steps">
        <span id="step-dot-1" class="active"></span>
        <span id="step-dot-2"></span>
        <span id="step-dot-3"></span>
      </div>

      <section id="step-downloads" class="panel visible">
        <h2 data-i18n="downloadsTitle"></h2>
        <div id="download-items"></div>
        <div class="total-row">
          <div class="label">
            <span data-i18n="totalLabel"></span>
            <span id="total-size-label"></span>
          </div>
          <div class="bar" id="total-bar"><i></i></div>
        </div>
        <div class="actions">
          <button id="downloads-continue" class="primary" disabled data-i18n="continueButton"></button>
        </div>
      </section>

      <section id="step-folder" class="panel">
        <h2 data-i18n="folderTitle"></h2>
        <p data-i18n="folderHint"></p>
        <p class="folder-path" id="folder-path"></p>
        <div class="row">
          <button id="choose-folder" data-i18n="chooseFolderButton"></button>
        </div>
        <div class="actions">
          <button id="folder-back" data-i18n="backButton"></button>
          <button id="folder-continue" class="primary" data-i18n="continueButton"></button>
        </div>
      </section>

      <section id="step-claude" class="panel">
        <h2 data-i18n="claudeTitle"></h2>
        <div class="row">
          <span data-i18n="claudeStatusLabel"></span>
          <span id="claude-status-badge" class="status-badge"></span>
        </div>
        <p id="claude-detail" class="folder-path"></p>
        <div class="row" id="claude-missing-help" style="display: none">
          <button id="claude-install-docs" class="link" data-i18n="claudeInstallDocsButton"></button>
          <button id="claude-recheck" data-i18n="claudeRecheckButton"></button>
        </div>
        <div class="actions">
          <button id="claude-back" data-i18n="backButton"></button>
          <button id="claude-skip" data-i18n="claudeSkipButton"></button>
          <button id="claude-finish" class="primary" data-i18n="finishButton"></button>
        </div>
      </section>
    </main>
    <script src="./setup.js"></script>
  </body>
</html>
